
# cargo-vet audits file

[[audits.chacha20]]
who = "Zaki Manian <zaki@iqlusion.io>"
criteria = "safe-to-deploy"
delta = "0.10.0 -> 0.10.2"
notes = """
Delta review of the 0.10.0 -> 0.10.2 diff, performed with Claude Code.

The release fixes an SSE4.1 intrinsic (_mm_extract_epi32) being called from a function declared target_feature(enable = "sse2"), which would execute an illegal instruction on a CPU with SSE2 and no SSE4.1. It is replaced by _mm_storeu_si128, and the counter save/load is factored into Backend::new / Backend::save_ctr. Equivalent behaviour, genuinely SSE2-only.

Rest of the diff: rng.rs corrects a doc typo and replaces a hardcoded 16 with BLOCK_WORDS (same value); chacha.rs narrows a pub use to use; lib.rs moves crate docs to the README. No functional change in any of them.

The NEON backend is rewritten from 4-block to 8-block outer batches, following OpenSSL's ChaCha20_512_neon. This is keystream-generating code and was not accepted on inspection alone: chacha20 0.10.2's own test suite, including the RFC true-value vectors and the RNG output vectors, was run and passes on aarch64-apple-darwin, where the NEON path is the one that executes.

No changes to key or nonce handling, counter semantics, or the round function."""

[[audits.ctor]]
who = "OpenAI Codex (automated source review)"
criteria = "safe-to-deploy"
delta = "0.2.9 -> 0.8.0"
notes = """
Reviewed the complete published source transition: syn/quote procedural implementation replaced by declarative macro parsing and small token-only proc-macro adapters, ctor/dtor split, attribute and feature handling, linker sections and priorities, startup/atexit callbacks, and OnceLock-backed static initialization. Read all Rust source, examples, manifests, and documentation. Archive SHA-256 matches Cargo.lock. No build scripts, network access, environment harvesting, or hidden execution beyond the documented caller-supplied startup/shutdown callbacks. Native aarch64-apple-darwin smoke fixture exercised procedural and declarative ctors, static initialization, and both destructor exports successfully. Windows/Linux/WASM runtime behavior and dynamic-library unload were source-reviewed but not executed. Ordinary lifecycle, linker-retention, and callback safety requirements remain. Detailed evidence: docs/dependency-review-tauri-2026-10.md.
"""

[[audits.ctor-proc-macro]]
who = "OpenAI Codex (automated source review)"
criteria = "safe-to-deploy"
version = "0.0.7"
notes = """
Full published-source review of the 111-line proc-macro adapter, manifests and documentation. Only constructs token streams to invoke ctor support macros; optional crate_path is caller-provided Rust syntax. No dependencies, build script, filesystem/network/process access, unsafe code, or host-environment reads. Archive checksum matches Cargo.lock. Exercised in native macOS constructor/static smoke fixture; no blocker found.
"""

[[audits.dtor]]
who = "OpenAI Codex (automated source review)"
criteria = "safe-to-deploy"
version = "0.3.0"
notes = """
Full published Rust-source review including the complete 642-line macro engine (byte-identical to ctor 0.8.0), exports, example, manifests, and documentation. Generated constructors register caller-supplied destructor callbacks with atexit or Apple __cxa_atexit; target linker sections, unsafe boundaries, visibility and feature propagation inspected. No unrelated I/O or build script. Archive checksum matches Cargo.lock. Both direct dtor and ctor re-export destructor callbacks ran in native macOS smoke fixture. Cross-platform behavior and dynamic-library unload remain unexecuted; callback lifecycle safety remains the caller's responsibility. No supply-chain blocker found.
"""

[[audits.dtor-proc-macro]]
who = "OpenAI Codex (automated source review)"
criteria = "safe-to-deploy"
version = "0.0.6"
notes = """
Full published-source review of the 116-line proc-macro adapter, manifests and documentation. dtor and __dtor_from_ctor emit token streams invoking the respective crate's declarative dtor parser. Optional crate_path only selects caller-provided Rust syntax. No dependencies, build script, filesystem/network/process access, unsafe code, or environment reads. Archive checksum matches Cargo.lock. Both exports exercised successfully by native macOS smoke fixture; no blocker found.
"""

