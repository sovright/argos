notes = "Reviewed complete published source delta, both manifests, metadata and bundled lockfile dependency inventory. Traced script callback dispatch, Windows popup creation after wry main-thread dispatch change, mobile lifecycle listener borrow release, activity/scene routing, Windows device-context release, monitor placement, general-autofill propagation and Apple content-process reload fallback. Error-dialog input narrows to static strings. IPC handler removal is an unused argument only; request payload routing is unchanged. No new secret collection or external endpoint. Build script unchanged. Native tests were not run; Apple reload can reset transient frontend state; dependencies audited separately."

[[audits.tauri-utils]]
who = "OpenAI Codex (automated source review)"
criteria = "safe-to-deploy"
delta = "2.8.3 -> 2.9.3"
notes = """
Reviewed the complete published source delta, both manifests and structured lockfile
metadata, including all new html2 code, CSP/nonce policy, ACL changes, Android XML
writes, file-association plist construction, resource iteration and startup binary
initialization. The HTML port preserves CSP modification gates and trusted-asset
isolation assumptions. Constructor adaptation keeps existing executable path and
symlink checks. No unexpected secret access, network destination or permission
grant found. Edge limitations: conversion of JSON u64 ACL values above i64::MAX
now wraps to negative i64; Android XML accepts trusted configuration without
escaping. Argos has no numeric permission scopes or Android file associations in
the inspected configuration. Static automated review, no platform/browser tests;
this entry does not audit dom_query, ctor, plist or other dependencies.
"""

