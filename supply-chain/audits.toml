[[audits.png]]
who = "OpenAI Codex (automated source review)"
criteria = "safe-to-deploy"
delta = "0.18.0-rc -> 0.18.1"
notes = """
Reviewed published crates.io source delta and moved filter modules, manifests,
and archive checksums. Inspected chunk length/CRC/order checks, allocation and
output-size arithmetic, in-place decompression lookback ownership, progressive
row handling, Adam7 expansion, Paeth scalar/SIMD filtering, and stream encoder
completion. Crate retains forbid(unsafe_code); no new network, process execution,
secret access or build script found. IO remains caller-supplied Read/Write;
filesystem use is confined to tests and examples. Published-crate library tests:
75 passed, 8 missing-fixture failures, 1 ignored. After restoring only tests/
fixtures from the exact published VCS commit, 83 passed, 0 failed, 1 ignored.
No fuzzing or cross-platform runtime validation. Automated delta review, not proof against all malformed-input
resource exhaustion or a full audit of baseline/transitive compression crates.
The baseline is linked by the Google import's 0.17.16 -> 0.18.0-rc audit.
Details: docs/dependency-review-tauri-2026-10.md.
"""

