[workspace]
members = ["crates/zeck-core", "crates/zeck-cli", "crates/argos-wallet-import", "gui/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.1.0"
license = "MIT OR Apache-2.0"
authors = ["The Bootstrap Org Inc"]
rust-version = "1.88"
repository = "https://github.com/sovright/argos"

[workspace.dependencies]
aes = "0.8.4"
anyhow = "1.0.100"
async-trait = "0.1.89"
bip0039 = "0.14.0"
# Header proof-of-work verification for the Sprout scan. Already in the tree
# via zcash_primitives; made direct so the scanner can call it.
equihash = "0.3"
blake2b_simd = "1.0.4"
# Curve25519 scalar multiplication for Sprout note decryption (the key
# agreement in protocol §5.5). No other crate in the tree provides it.
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = "0.10.1"
# JoinSplit signatures. ed25519-zebra rather than ed25519-dalek: Zcash
# consensus requires ZIP 215 verification semantics, which this implements and
# which the two libraries disagree about on edge-case signatures.
ed25519-zebra = "4.0.3"
# Named only to load the Sprout Groth16 proving key; both already arrive via
# zcash_proofs, which exposes the verifying key but not the proving key.
bellman = "0.14"
bls12_381 = "0.8"
# Named only for script::Code when hand-assembling a V4 transparent bundle;
# already in the tree via zcash_transparent.
zcash_script = "0.4.3"
base64 = "0.22"
cbc = { version = "0.1.2", features = ["alloc"] }
clap = { version = "4.5.53", features = ["derive"] }
crypto_secretbox = "0.1.1"
dialoguer = "0.12.0"
indicatif = "0.18.2"
orchard = "0.15"
# Already in the tree, pinned by the librustzcash stack; promoted to a direct
# dependency (as `orchard` already is) so transparent-only recovery can name
# Sapling payment addresses, anchors, and provers. Adds no new package.
sapling-crypto = { version = "0.7", default-features = false }
# Already in the tree via zcash_client_backend; promoted to a direct dependency
# so the imported-key sweep can drive the PCZT roles. Spending a standalone
# Sapling key is impossible through `SpendingKeys`, which takes its Sapling
# authority solely from a `UnifiedSpendingKey`; the PCZT signer accepts a raw
# spend authorizing key. Adds no new package.
pczt = { version = "0.9.1", default-features = false, features = ["prover", "signer", "tx-extractor", "io-finalizer", "spend-finalizer", "sapling", "orchard", "transparent"] }
prost = "0.14.3"
rand_core = "0.6.4"
rusqlite = "0.37.0"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "logging", "std", "tls12"] }
secp256k1 = "0.29.1"
secrecy = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.10.3" }
tauri-build = "2.5.6"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.2"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tonic = "0.14.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
url = "2.5.8"
keepawake = "0.6"
sha2 = { version = "0.10", features = ["compress"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
# ─── Zcash protocol stack — Ironwood (NU6.3) ──────────────────────────────────
#
# NU6.3 / Ironwood activates on mainnet at height 3_428_143. Consensus branch
# IDs for that upgrade first appear in zcash_protocol 0.10.0, so anything below
# that line signs sweeps with the NU6.2 branch ID and gets them rejected once
# the chain passes activation.
#
# The wallet crates that expose it — zcash_client_backend / zcash_client_sqlite
# — have no stable release on the 0.10 protocol line yet, only release
# candidates. Those two are pinned with `=` rather than a caret so an RC bump
# upstream cannot silently change what we ship; revisit both pins when 0.24.0 /
# 0.22.0 go final.
zcash_address = "0.13"
zcash_client_backend = { version = "=0.24.0-rc.4", default-features = false, features = ["lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots", "orchard", "pczt", "sync", "transparent-inputs", "transparent-key-import"] }
zcash_client_sqlite = { version = "=0.22.0-rc.4", default-features = false, features = ["orchard", "serde", "transparent-inputs", "transparent-key-import"] }
zcash_keys = { version = "0.16", default-features = false, features = ["std", "sapling", "orchard", "transparent-inputs"] }
zcash_primitives = "0.30"
zcash_proofs = { version = "0.30", default-features = false, features = ["bundled-prover"] }
zcash_protocol = "0.10"
zcash_transparent = { version = "0.10", default-features = false, features = ["std", "transparent-inputs"] }
tempfile = "3.20.0"
zip32 = "0.2.1"

# Dependencies are optimised even in dev/test builds. Sprout proving is
# Groth16 over BLS12-381, and at opt-level 0 the field arithmetic in
# `bellman`/`bls12_381` is slow enough that the consensus spend tests take
# tens of minutes and time out in CI. Workspace crates keep their own dev
# profile, so debugging and assertions are unaffected -- only third-party
# code is optimised, and only its compile time pays, once, behind the cache.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
