name: ci

on:
  push:
  pull_request:

# Least-privilege default: every job opts in explicitly to anything beyond
# read-only metadata. Mitigates third-party Action token-exfiltration risk
# (THREAT_MODEL.md §6.6 T-SC3).
permissions: {}

jobs:
  check:
    name: Cargo check & clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master@2026-05-27
        with:
          toolchain: "1.88"
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

  check-windows:
    name: Cargo check (Windows ${{ matrix.label }})
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - label: x64
            target: x86_64-pc-windows-msvc
          - label: ARM64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master@2026-05-27
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo check (workspace)
        run: cargo check --workspace --target ${{ matrix.target }}

  test:
    name: Cargo test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master@2026-05-27
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo test
        run: cargo test --workspace

  sprout-node-tests:
    name: Sprout scan against a real node
    runs-on: ubuntu-latest
    # The end-to-end scan mines 110 blocks for coinbase maturity, plants a
    # note, then walks the chain; the two spend tests each prove a JoinSplit
    # against the real 725 MB parameters. With dependencies optimised in the
    # dev profile (see the root Cargo.toml) the four tests run in a couple of
    # minutes; the headroom here is for the cold dependency build behind a
    # cache miss, not for the tests.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master@2026-05-27
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # The spend tests below build `--features argos-network`, and that is the
      # only configuration in which `crates/zeck-core/build.rs` compiles the
      # vendored lightwalletd protos -- which needs `protoc`. No other job
      # enables the feature, so nothing needed this until the spend tests were
      # added and the build died before a single test ran.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # The only regtest chain that can hold Sprout notes: ZIP 211 forbids
      # funding the pool from Canopy onward, and this profile holds Canopy
      # inactive (nuparams e9ff75a6:9999999).
      - name: Start the regtest Sprout node
        working-directory: tests/regtest
        run: docker compose --profile sprout up -d zcashd-sprout

      - name: Wait for the node to accept RPC
        run: |
          for i in $(seq 1 60); do
            if curl -sf --user argos-regtest:argos-regtest \
                 --data '{"jsonrpc":"1.0","id":"ci","method":"getblockchaininfo","params":[]}' \
                 -H 'content-type: text/plain;' http://127.0.0.1:18242/ >/dev/null; then
              echo "node is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "node did not accept RPC within 60s"
          docker compose --profile sprout -f tests/regtest/docker-compose.yml logs --tail=50 zcashd-sprout || true
          exit 1

      # `sprout_scan_finds_a_real_note` PLANTS a note, which means building a
      # JoinSplit, which needs the Sprout proving key -- an earlier version of
      # this job asserted these two tests needed no parameters. That was wrong,
      # and CI is where it surfaced. Cached, so the 725 MB download happens
      # once rather than per run.
      - name: Cache Sprout proving parameters
        id: sprout-params
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.zcash-params/sprout-groth16.params
          key: sprout-groth16-params-v1

      - name: Fetch Sprout proving parameters
        if: steps.sprout-params.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.zcash-params
          curl -fsSL --retry 3 -o ~/.zcash-params/sprout-groth16.params \
            https://download.z.cash/downloads/sprout-groth16.params
          # The params are verified by digest before use (see sprout_sweep.rs),
          # but check the size here so a truncated download fails loudly rather
          # than as a confusing proving error.
          test "$(stat -c%s ~/.zcash-params/sprout-groth16.params)" = "725523612"

      # `--ignored` is required. These are the only tests that exercise the
      # Sprout scan end to end, and they are the reason
      # this job exists: `argos scan-sprout` once shipped unable to scan
      # anything from a cold start -- every fresh walk aborted on its first
      # page -- while the docs described it as proven on regtest. Nothing in
      # CI ran them, so nothing caught it.
      - name: Sprout scan tests
        run: |
          cargo test -p argos-core \
            --test sprout_scan_matches_the_node \
            --test sprout_scan_finds_a_real_note \
            -- --ignored --nocapture

      # The spend half, and the reason it is no longer optional: `rcm` is now
      # sampled per §4.7.1 rather than derived, which changes *every*
      # commitment Argos produces. A commitment the circuit and the chain
      # disagree about is exactly what these catch, and a local proof check
      # cannot -- only a node decides whether a spend is valid.
      #
      # These were previously excluded for being proving-heavy. That was the
      # right trade only while the commitment derivation was frozen.
      #
      # `--features argos-network` is not optional: `sprout_consensus_roundtrip`
      # is `#![cfg(feature = "argos-network")]`, so without it the binary
      # compiles to zero tests and cargo still reports "ok". A green step that
      # ran nothing is worse than a red one. The count is asserted below rather
      # than trusted.
      - name: Sprout spend tests against consensus
        run: |
          set -o pipefail
          cargo test -p argos-core --features argos-network \
            --test sprout_consensus_roundtrip \
            --test sprout_stale_anchor \
            -- --ignored --nocapture 2>&1 | tee spend-tests.log

      - name: Check the spend tests actually ran
        run: |
          passed=$(grep -cE '^test .* \.\.\. ok$' spend-tests.log || true)
          echo "spend tests passed: $passed"
          # Two: one per file. Asserted as an exact floor so that a file
          # silently emptying itself -- a cfg gate, a rename -- turns this
          # job red instead of green.
          if [ "$passed" -lt 2 ]; then
            echo "::error::expected 2 passing spend tests, saw $passed -- a cfg gate or a rename has silently emptied this job"
            exit 1
          fi

      - name: Node logs on failure
        if: failure()
        working-directory: tests/regtest
        run: docker compose --profile sprout logs --tail=200 zcashd-sprout

  cargo-deny:
    name: Cargo deny (advisories + bans + licenses + sources)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@a531616d8ce3b9177443e48a1159bc945a099823 # v2.0.19
        with:
          command: check advisories bans licenses sources

  cargo-vet:
    name: Cargo vet (third-party crate audits)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master@2026-05-27
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Use the same major series librustzcash uses (~0.10).
      - run: cargo install cargo-vet --version "~0.10" --locked

      # `--locked` uses the committed imports.lock; no network for fresh
      # import resolution. Refreshing the imports is a deliberate local
      # action (`cargo vet update-imports`) so an upstream rewrite of any
      # imported audits.toml cannot silently change our trust set.
      - run: cargo vet --locked
