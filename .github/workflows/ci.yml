name: ci

on:
  push:
  pull_request:

# Least-privilege default: every job opts in explicitly to anything beyond
# read-only metadata. Mitigates third-party Action token-exfiltration risk
# (THREAT_MODEL.md §6.6 T-SC3).
permissions: {}

jobs:
  check:
    name: Cargo check & clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master@2026-05-27
        with:
          toolchain: "1.88"
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

  check-windows:
    name: Cargo check (Windows ${{ matrix.label }})
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - label: x64
            target: x86_64-pc-windows-msvc
          - label: ARM64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master@2026-05-27
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo check (workspace)
        run: cargo check --workspace --target ${{ matrix.target }}

  test:
    name: Cargo test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master@2026-05-27
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo test
        run: cargo test --workspace

      # The `sprout` feature only lands with Track B. On the branches beneath it
      # the feature is not defined yet, so probe and skip rather than fail on a
      # feature that does not exist. Correct on every layer -- skips where
      # absent, runs where present -- so this guard is identical across the
      # whole stack and survives rebasing.
      - name: Probe for the sprout feature
        id: sprout
        run: |
          if cargo metadata --format-version 1 --no-deps \
               | jq -e '.packages[] | select(.name == "argos-core") | .features | has("sprout")' >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::sprout feature not defined at this layer; skipping Sprout build"
          fi

      # After the `sprout` feature landed, `--workspace` alone builds Track A
      # only, so nothing in CI compiled the Sprout code at all. This keeps it
      # type-checked on every push; the node-backed job below is what actually
      # runs it.
      - name: cargo test (--features sprout)
        if: steps.sprout.outputs.present == 'true'
        run: cargo test --workspace --features argos-core/sprout,argos-cli/sprout

  sprout-node-tests:
    name: Sprout scan against a real node
    runs-on: ubuntu-latest
    # Generous: the end-to-end scan mines 110 blocks for coinbase maturity,
    # plants a note, then walks the chain. ~6 minutes locally.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master@2026-05-27
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # See the guard note in the test job: skip the whole node-backed run on
      # layers where the sprout feature is not defined yet.
      - name: Probe for the sprout feature
        id: sprout
        run: |
          if cargo metadata --format-version 1 --no-deps \
               | jq -e '.packages[] | select(.name == "argos-core") | .features | has("sprout")' >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::sprout feature not defined at this layer; skipping Sprout node tests"
          fi

      # The only regtest chain that can hold Sprout notes: ZIP 211 forbids
      # funding the pool from Canopy onward, and this profile holds Canopy
      # inactive (nuparams e9ff75a6:9999999).
      - name: Start the regtest Sprout node
        if: steps.sprout.outputs.present == 'true'
        working-directory: tests/regtest
        run: docker compose --profile sprout up -d zcashd-sprout

      - name: Wait for the node to accept RPC
        if: steps.sprout.outputs.present == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -sf --user argos-regtest:argos-regtest \
                 --data '{"jsonrpc":"1.0","id":"ci","method":"getblockchaininfo","params":[]}' \
                 -H 'content-type: text/plain;' http://127.0.0.1:18242/ >/dev/null; then
              echo "node is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "node did not accept RPC within 60s"
          docker compose --profile sprout -f tests/regtest/docker-compose.yml logs --tail=50 zcashd-sprout || true
          exit 1

      # `sprout_scan_finds_a_real_note` PLANTS a note, which means building a
      # JoinSplit, which needs the Sprout proving key -- an earlier version of
      # this job asserted these two tests needed no parameters. That was wrong,
      # and CI is where it surfaced. Cached, so the 725 MB download happens
      # once rather than per run.
      - name: Cache Sprout proving parameters
        id: sprout-params
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.zcash-params/sprout-groth16.params
          key: sprout-groth16-params-v1

      - name: Fetch Sprout proving parameters
        if: steps.sprout-params.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.zcash-params
          curl -fsSL --retry 3 -o ~/.zcash-params/sprout-groth16.params \
            https://download.z.cash/downloads/sprout-groth16.params
          # The params are verified by digest before use (see sprout_sweep.rs),
          # but check the size here so a truncated download fails loudly rather
          # than as a confusing proving error.
          test "$(stat -c%s ~/.zcash-params/sprout-groth16.params)" = "725523612"

      # `--features sprout` AND `--ignored`, both required. These are the only
      # tests that exercise the Sprout scan end to end, and they are the reason
      # this job exists: `argos scan-sprout` once shipped unable to scan
      # anything from a cold start -- every fresh walk aborted on its first
      # page -- while the docs described it as proven on regtest. Nothing in
      # CI ran them, so nothing caught it.
      #
      # Deliberately not the whole `--ignored` set: the remaining Sprout tests
      # are proving-heavy (several minutes each) and belong in their own job if
      # they are ever wanted. These two are the ones that cover the scan.
      - name: Sprout scan tests
        if: steps.sprout.outputs.present == 'true'
        run: |
          cargo test -p argos-core --features sprout \
            --test sprout_scan_matches_the_node \
            --test sprout_scan_finds_a_real_note \
            -- --ignored --nocapture

      - name: Node logs on failure
        if: failure() && steps.sprout.outputs.present == 'true'
        working-directory: tests/regtest
        run: docker compose --profile sprout logs --tail=200 zcashd-sprout

  cargo-deny:
    name: Cargo deny (advisories + bans + licenses + sources)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@a531616d8ce3b9177443e48a1159bc945a099823 # v2.0.19
        with:
          command: check advisories bans licenses sources

  cargo-vet:
    name: Cargo vet (third-party crate audits)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master@2026-05-27
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Use the same major series librustzcash uses (~0.10).
      - run: cargo install cargo-vet --version "~0.10" --locked

      # `--locked` uses the committed imports.lock; no network for fresh
      # import resolution. Refreshing the imports is a deliberate local
      # action (`cargo vet update-imports`) so an upstream rewrite of any
      # imported audits.toml cannot silently change our trust set.
      - run: cargo vet --locked
