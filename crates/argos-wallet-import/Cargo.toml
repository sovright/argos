[package]
name = "argos-wallet-import"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
# `sprout` — marker only. The parser stays UNCONDITIONAL (a default Argos
# build still detects and counts Sprout keys/notes in a wallet), so this gates
# nothing in `src/`. It exists solely so the Sprout-specific test
# (`sprout_key_is_genuine`) can be `#![cfg(feature = "sprout")]`-gated along
# with the rest of the Sprout-only tests, and compiles out cleanly by default.
sprout = []

[dependencies]
aes.workspace = true
bip0039.workspace = true
blake2b_simd.workspace = true
cbc.workspace = true
crypto_secretbox.workspace = true
secrecy.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
secp256k1.workspace = true
tempfile.workspace = true
