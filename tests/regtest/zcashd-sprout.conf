# zcashd regtest for the Sprout spend test.
#
# Canopy is held far out of reach so the Sprout pool stays open: ZIP 211
# disables adding value to it from Canopy onward, and a note has to exist
# before the spend path can be tested. Sapling is active from height 1 so
# JoinSplits ride in v4 transactions with Groth16 proofs, which is what
# Argos produces.
#
# Branch IDs, in activation order: BeforeOverwinter, Overwinter, Sapling,
# Blossom, Heartwood, Canopy.
regtest=1
nuparams=5ba81b19:1
nuparams=76b809bb:1
nuparams=2bb40e60:1
nuparams=f5b9230b:1
nuparams=e9ff75a6:9999999

rpcuser=argos-regtest
rpcpassword=argos-regtest
rpcbind=0.0.0.0
rpcport=18232
rpcallowip=0.0.0.0/0
server=1
txindex=1
i-am-aware-zcashd-will-be-replaced-by-zebrad-and-zallet-in-2025=1

# Sprout key generation is deprecated-disabled by default.
allowdeprecated=z_getnewaddress
