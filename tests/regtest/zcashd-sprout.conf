# zcashd regtest for the Sprout spend test.
#
# Canopy is held far out of reach so the Sprout pool stays open: ZIP 211
# disables adding value to it from Canopy onward, and a note has to exist
# before the spend path can be tested. Sapling is active from height 1 so
# JoinSplits ride in v4 transactions with Groth16 proofs, which is what
# Argos produces.
#
# Branch IDs, in activation order: BeforeOverwinter, Overwinter, Sapling,
# Blossom, Heartwood, Canopy.
regtest=1
nuparams=5ba81b19:1
nuparams=76b809bb:1
nuparams=2bb40e60:1
nuparams=f5b9230b:1
nuparams=e9ff75a6:9999999

rpcuser=argos-regtest
rpcpassword=argos-regtest
rpcbind=0.0.0.0
rpcport=18232
rpcallowip=0.0.0.0/0
server=1
txindex=1
i-am-aware-zcashd-will-be-replaced-by-zebrad-and-zallet-in-2025=1

# Sprout address generation is deprecated-disabled by default, and this is
# the only chain where it can work at all: zcashd refuses to create a Sprout
# address once Canopy has activated, and Canopy is held out of reach here.
#
# Needed to build a wallet.dat holding a *funded* Sprout note, which is the
# one fixture the end-to-end sweep test requires and which no existing
# fixture can be (ZIP 211 forbids funding the pool on any current chain).
#
# Only this feature takes the flag. Adding `allowdeprecated=z_exportkey`
# beside it is fatal at startup -- it is not separately deprecated, and
# zcashd rejects an unknown feature name rather than warning.
allowdeprecated=z_getnewaddress

# backupwallet writes a consistent copy of wallet.dat here. Reading the
# live file instead would race Berkeley DB mid-write, and the end-to-end
# test needs a wallet file that is not half-written.
exportdir=/srv/zcashd/.zcash

# Serve `getheaders` to peers on a chain whose tip is old.
#
# zcashd stays in initial block download while its tip is older than
# maxtipage (24h by default) and refuses to answer getheaders, which on a
# long-lived regtest chain means the p2p tests fail with a bare timeout that
# looks like a framing bug. Nothing here is time-sensitive.
maxtipage=31536000
